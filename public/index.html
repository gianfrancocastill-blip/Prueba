<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draft Stars</title>
<script src="/socket.io/socket.io.js"></script>
<style>
 :root{--bg:#0f172a;--c:#1e293b;--t:#f8fafc;--a:#3b82f6;--g:#10b981}
 *{box-sizing:border-box;font-family:system-ui,sans-serif}
 body{margin:0;padding:12px;background:var(--bg);color:var(--t)}
 h1,h2,h3,p{margin:0}
 .card{background:var(--c);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 4px 6px -1px #0005}
 .btn{background:var(--a);color:#fff;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
 .btn:disabled{opacity:.5;cursor:not-allowed}
 .btn.gold{background:var(--g)}
 .hidden{display:none!important}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
 .row{display:flex;justify-content:space-between;align-items:center}
 .player-card{background:#2a364a;padding:12px;border-radius:8px;border-left:4px solid var(--a)}
 .ov{font-size:24px;font-weight:900;color:var(--g)}
 .squad-list{margin-top:8px;font-size:12px;color:#cbd5e1;display:grid;grid-template-columns:1fr 1fr;gap:4px}
 .sq-item{background:#1e293b;padding:4px 8px;border-radius:4px;border:1px solid #334155}
 .bids{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
 .timer{font-size:32px;font-weight:bold;text-align:center;color:var(--a);margin:10px 0}
 #reveal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--c);padding:24px;border-radius:16px;box-shadow:0 10px 25px #000;z-index:100;width:90%;max-width:400px;border:2px solid var(--g);text-align:center}
</style>
</head>
<body>

<div id="login" class="card">
 <h1>Draft Stars 🔞</h1><p style="margin-bottom:16px;color:#94a3b8">Crea tu equipo de ensueño</p>
 <input id="nick" placeholder="Tu nombre" style="width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:none;background:#2a364a;color:#fff">
 <div class="row" style="gap:12px">
  <button class="btn" onclick="create()">CREAR SALA</button>
  <button class="btn gold" onclick="join()">UNIRSE</button>
 </div>
</div>

<div id="lobby" class="card hidden">
 <div class="row"><h2>Sala: <span id="code" style="color:var(--a)"></span></h2><span id="pcount"></span></div>
 <div id="plist" style="margin:16px 0;display:flex;flex-direction:column;gap:8px"></div>
 <button id="start" class="btn gold hidden" onclick="socket.emit('start')">INICIAR DRAFT</button>
 <p id="wait" class="hidden" style="text-align:center;color:#94a3b8">Esperando al host...</p>
</div>

<div id="game" class="hidden">
 <div class="card" style="text-align:center">
  <h2 style="color:var(--g)">Ronda <span id="ronda"></span> - <span id="pos"></span></h2>
  <div class="timer">⏳ <span id="time">20</span>s</div>
  <div style="background:#2a364a;padding:16px;border-radius:12px;margin-top:12px">
   <div class="row" style="justify-content:center;gap:12px">
    <div>
     <div style="font-size:12px;color:#94a3b8">PRECIO BASE</div>
     <div style="font-size:24px;font-weight:bold">€<span id="base"></span>M</div>
    </div>
    <div style="border-left:1px solid #475569;padding-left:12px">
     <div style="font-size:12px;color:#94a3b8">PUJA ACTUAL</div>
     <div style="font-size:24px;font-weight:bold;color:var(--g)">€<span id="bid"></span>M</div>
    </div>
   </div>
   <p id="leader" style="margin-top:8px;font-weight:bold;color:#facc15"></p>
  </div>
  <div class="bids">
   <button class="btn bid" onclick="socket.emit('bid')">PUJAR +€5M</button>
  </div>
  <button id="skip-btn" class="btn hidden" style="width:100%;margin-top:12px;background:#e66565;color:#fff" onclick="skip()">⏭️ SKIPEAR</button>
 </div>
 <div class="grid" id="players"></div>
</div>

<div id="reveal" class="hidden"></div>

<script>
 const socket=io();
 const $=id=>document.getElementById(id);
 let state=null;

 function create(){socket.emit("createRoom",{name:$("nick").value,maxPlayers:4},r=>{if(r.ok)$("login").classList.add("hidden")})}
 function join(){
  const c=prompt("Código de sala:");
  if(c)socket.emit("joinRoom",{code:c,name:$("nick").value},r=>{
   if(r.ok)$("login").classList.add("hidden");else alert(r.msg);
  });
 }
 function skip(){socket.emit("skip",r=>{if(r&&!r.ok)alert(r.msg)})}

 socket.on("tick", t => {
   $("time").textContent = t;
   if(t <= 5) $("time").style.color = "#ef4444";
   else $("time").style.color = "var(--a)";
 });

 socket.on("reveal", r => {
  $("reveal").classList.remove("hidden");
  if(r.winner === null) {
    $("reveal").innerHTML=`<div class="row" style="flex-direction:column;gap:12px"><div><h2>⏭️ ${r.msg}</h2><b>${r.person.name}</b><p>${r.person.nation} · ${r.person.height} cm · ${r.person.category}</p></div><div class="ov" style="color:#68758a">${r.person.ovr}</div></div>`;
  } else {
    $("reveal").innerHTML=`<div class="row" style="flex-direction:column;gap:12px"><div><h2>🔨 ${r.winner} — €${r.price}M</h2><b>${r.person.name}</b><p>${r.person.nation} · ${r.person.height} cm · ${r.person.category}</p></div><div class="ov">${r.person.ovr}</div></div>`;
  }
 });

 socket.on("state",s=>{
  state=s;
  $("reveal").classList.add("hidden");
  
  if(!s.started){
   $("lobby").classList.remove("hidden");
   $("code").textContent=s.code;
   $("pcount").textContent=`${s.players.length}/${s.maxPlayers}`;
   $("plist").innerHTML=s.players.map(p=>`<div class="player-card" style="border-left-color:${p.id===s.host?'var(--g)':'var(--a)'}">${p.id===s.host?'👑 ':''}${p.name}</div>`).join("");
   if(socket.id===s.host){$("start").classList.remove("hidden");$("wait").classList.add("hidden")}
   else{$("start").classList.add("hidden");$("wait").classList.remove("hidden")}
   return;
  }
  
  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");
  
  if(s.finished){
   $("game").innerHTML=`<div class="card"><h1 style="text-align:center;color:var(--g)">¡DRAFT FINALIZADO!</h1></div><div class="grid" id="players"></div>`;
  }
  
  const a=s.auction;
  if(a){
   const posList=["POR","LD","DFC","DFC","LI","MC","MC","MC","ED","DC","EI"];
   $("ronda").textContent=s.pos+1;
   $("pos").textContent=posList[s.pos];
   $("base").textContent=a.start;
   $("bid").textContent=a.bid;
   const lead=s.players.find(p=>p.id===a.leader);
   $("leader").textContent=lead?"🔥 "+lead.name+" va ganando":"Sin pujas";
   
   document.querySelectorAll(".bid").forEach((b,i)=>{
    const adds=[5];
    const p=s.players.find(x=>x.id===socket.id);
    b.disabled=a.closed || !p || p.squad[s.pos] || p.budget < a.bid+adds[i];
   });
   
   const skipBtn = $("skip-btn");
   if(skipBtn) {
     const p = s.players.find(x => x.id === socket.id);
     const isActive = p && !p.squad[s.pos];
     skipBtn.classList.toggle("hidden", !isActive || a.closed);
     
     if(isActive) {
       const activeCount = s.players.filter(x => !x.squad[s.pos]).length;
       const hasSkipped = a.skips.includes(socket.id);
       const isLeader = a.leader === socket.id;
       
       skipBtn.disabled = a.closed || hasSkipped || isLeader || (activeCount === 1 && p.soloSkipUsed);
       
       if(activeCount === 1) {
          skipBtn.textContent = p.soloSkipUsed ? "❌ SIN SKIPS" : "⏭️ SKIPEAR (Último skip)";
       } else {
          skipBtn.textContent = `⏭️ SKIPEAR (${a.skips.length}/${activeCount})`;
       }
     }
   }
  }
  
  $("players").innerHTML=s.players.map(p=>`
   <div class="player-card">
    <div class="row"><b>${p.name}</b><span style="color:var(--g);font-weight:bold">€${p.budget}M</span></div>
    <div class="squad-list">
     ${p.squad.map((sq,i)=>{
      const pName=["POR","LD","DFC","DFC","LI","MC","MC","MC","ED","DC","EI"][i];
      if(!sq) return `<div class="sq-item" style="color:#64748b">${pName}: Vacío</div>`;
      return `<div class="sq-item"><b style="color:var(--a)">${pName}:</b>${sq.name} <span style="color:var(--g)">(${sq.ovr})</span></div>`;
     }).join("")}
    </div>
   </div>
  `).join("");
 });
</script>
</body>
</html>
